<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <meta name="description" content="form for learning how to make forms by making a form for the form project about making fomrs">
    <meta name="author" content="Miles Wendler">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="sel">Product Name</label>
                <select name="product" class="products" id="sel" required>
                <option >Please Select One...</option>
                </select>


            <label for="horis">Overall Rating</label>
                <div id="horis">
                    <label for="one">☆</label><input type="radio" name="rating"value="one" id="one"required>
                    <label for="two">☆☆</label><input type="radio" name="rating"value="two" id="two"required>
                    <label for="three">☆☆☆</label><input type="radio" name="rating"value="three" id="three"required>
                    <label for="four">☆☆☆☆</label><input type="radio" name="rating"value="four" id="four"required>
                    <label for="five">☆☆☆☆☆</label><input type="radio" name="rating"value="five" id="five"required>
                </div>


            <label>Date of Installation <input type="date" id="date-input" name="date" required></label>

            <label for="pluh">Which features did you find useful in the product?</label><div id="pluh">
                <p>(check all that apply)</p>
                <input type="checkbox" id="dura" name="durability" value="Durability"><label for="dura">Durability</label>
                <input type="checkbox" id="ease" name="ease-of-use" value="Ease of Use"><label for="ease">Ease of Use</label>
                <input type="checkbox" id="perf" name="performance" value="Performance"><label for="perf">Performance</label>
                <input type="checkbox" id="desi" name="design" value="Design"><label for="desi">Design</label>
            </div>

            <label for="review">Written Review (optional)</label>
                <textarea name="reviewed" id="review"></textarea>
            

            <label for="name">User Name (optional) </label>
                <input type="text" id="name" name="name">
            

            <input id="submit" type="submit" value="Post Review">

        </form>
    </main>
    <footer>
        <p>
            <span id="currentyear"></span>
            Miles Wendler
            Washington - USA
        </p>
        <p id="last-modified">

        </p>
    </footer>
</body>
</html>
