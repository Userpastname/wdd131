https<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada=Place</title>
    <meta name="description" content="Canada is a country with stuff in it and weather. Really bad weather. You will find out in this website how bad Weather is in Canada">
    <meta name="author" content="Miles Wendler">

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer>

    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Canada</h1>
    </header>
    <main>
        <div class="hero">
                <picture>
                    <source media="(min-width: 1000px)" srcset="images/canada-lights-bear.webp">
                    <img src="images/canada-moose.webp" alt="photo of canadian widlife">
                </picture>

            <section id="data">
                <div class="of">
                    <h2 class="inside">Data</h2>
                    <div class="middle">
                        <p id="label">Area: </p>
                        <p>9,984,670 sq km</p>
                    </div>
                    <div class="middle">
                        <p id="label">Population: </p>
                        <p>40,330,253</p>
                    </div>
                    <div class="middle">
                        <p id="label">Capital: </p>
                        <p>Ottawa</p>
                    </div>
                    <div class="middle">
                        <p id="label">Languages: </p>
                        <p>English,French</p>
                    </div>
                    <div class="middle">
                        <p id="label">Currency: </p>
                        <p>Canadian dollar</p>
                    </div>
                </div>


            </section>
            <section id="weather">
                <div class="of">
                    <h2 id="inside" class="con">Weather</h2>
                    <img class="icon" src="images/ice.svg" alt="snowflake icon">
                    <div class="middle">
                        <p id="label">Temperature: </p>
                        <p>3.1°C</p>
                    </div>
                    <div class="middle">
                        <p id="label">Conditions: </p>
                        <p>Snowing</p>
                    </div>
                    <div class="middle">
                        <p id="label">Wind: </p>
                        <p>5km/h</p>
                    </div>
                    <div class="middle">
                        <p id="label">Wind Chill: </p>
                        <p></p>
                    </div>
                </div>

            </section>
        </div>
    </main>
    <footer>
        <p>
            <span id="currentyear"></span>
            Miles Wendler
            Washington - USA
        </p>
        <p id="last-modified">

        </p>

    </footer>
</body>
</html>
